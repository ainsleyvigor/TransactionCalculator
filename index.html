<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Surcharge Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .dollar-sign {
            position: absolute;
            left: 15px;
            color: #666;
            font-size: 20px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 15px 15px 15px 35px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 18px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .results {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            margin-top: 25px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .result-label {
            color: #666;
        }

        .result-value {
            color: #333;
            font-weight: 500;
        }

        .total {
            border-top: 2px solid #ddd;
            padding-top: 15px;
            margin-top: 15px;
        }

        .total .result-label {
            color: #333;
            font-weight: 600;
            font-size: 16px;
        }

        .total .result-value {
            color: #667eea;
            font-weight: 700;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>Transaction Surcharge Calculator</h1>
        <p class="subtitle">Calculate 1.1% + $0.20</p>
        
        <div class="input-group">
            <label for="amount">Enter Amount</label>
            <div class="input-wrapper">
                <span class="dollar-sign">$</span>
                <input 
                    type="number" 
                    id="amount" 
                    placeholder="0.00" 
                    step="0.01"
                    min="0"
                >
            </div>
        </div>

        <div class="results">
            <div class="result-row">
                <span class="result-label">Original Amount:</span>
                <span class="result-value" id="original">$0.00</span>
            </div>
            <div class="result-row">
                <span class="result-label">1.1% Fee:</span>
                <span class="result-value" id="percentage">$0.00</span>
            </div>
            <div class="result-row">
                <span class="result-label">Fixed Fee:</span>
                <span class="result-value" id="fixed">$0.20</span>
            </div>
            <div class="result-row total">
                <span class="result-label">Total with Fees:</span>
                <span class="result-value" id="total">$0.20</span>
            </div>
        </div>
    </div>

    <script>
        const amountInput = document.getElementById('amount');
        const originalSpan = document.getElementById('original');
        const percentageSpan = document.getElementById('percentage');
        const totalSpan = document.getElementById('total');

        function calculate() {
            const amount = parseFloat(amountInput.value) || 0;
            const percentageFee = amount * 0.011;
            const fixedFee = 0.20;
            const total = amount + percentageFee + fixedFee;

            originalSpan.textContent = '$' + amount.toFixed(2);
            percentageSpan.textContent = '$' + percentageFee.toFixed(2);
            totalSpan.textContent = '$' + total.toFixed(2);
        }

        amountInput.addEventListener('input', calculate);
        calculate();
    </script>
</body>
</html>
